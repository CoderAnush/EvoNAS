# idea.md path alias — delegates to continuous_learning defaults
run_id: continuous_default
seed: 42
simulate: true

continuous:
  simulate: true
  merge_strategy: sliding_window
  window_size: 40
  sample_fraction: 1.0
  artifacts_root: artifacts/continuous_learning
  policy:
    min_new_samples: 10
    max_drift_psi: 0.25
    mild_drift_psi: 0.1
    retrain_cooldown_hours: 0.0
    optimize_on_schema_change: true
    optimize_on_significant_drift: true
    allow_retrain_on_mild_drift: true
  retention:
    max_versions: 15
    keep_latest: 5
    delete_raw_arrays: false

simulation:
  n_reference: 80
  n_new: 25
  feature_shift: 0.75

experiment:
  artifacts_root: artifacts/continuous_learning
