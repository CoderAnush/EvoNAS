# Self-Adaptive PSO — Phase 5 (deterministic adaptation from swarm behaviour)
run_id: sapso_adaptive_quick
seed: 42

dataset:
  config_path: configs/datasets/toy_quick.yaml

search_space:
  path: configs/search_spaces/cnn_quick.yaml

optimization:
  algorithm: sapso
  swarm_size: 6
  max_iterations: 8
  # Initial / fallback Clerc-style values (adapted each iteration)
  w: 0.729
  c1: 1.49445
  c2: 1.49445
  velocity:
    kappa: 0.2
  init_velocity_scale: 0.2
  initialization: random
  checkpoint_every: 2
  log_particles: true

adaptation:
  inertia:
    w_min: 0.4
    w_max: 0.9
    w_refine: 0.35
    alpha: 0.5
    beta: 0.3
    gamma: 0.2
    eta_slow: 0.001
    eta_good: 0.01
    improvement_window: 3
  acceleration:
    c_min: 0.5
    c_max: 2.5
    c_sum: 4.1
    delta_collapse: 0.05
    delta_high: 0.35
  stagnation_iters: 5
  converge_eta: 0.002
  converge_diversity: 0.25
  w0: 0.729
  c1_0: 1.49445
  c2_0: 1.49445

data:
  subset_fraction: 0.5
  subset_seed: 42

training:
  epochs: 2
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  device: cpu
  seed: 42

fitness:
  mode: architecture
  sense: maximize
  primary_metric: accuracy
  weights:
    accuracy: 1.0
  penalties:
    param_lambda: 0.0
  fail_value: -1.0

experiment:
  artifacts_root: artifacts/optimization

logging:
  level: INFO
